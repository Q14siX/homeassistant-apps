configuration:
  max_upload_mb:
    name: Maximum upload size
    description: Maximum size of an uploaded ZIP file in megabytes.
  create_safety_backup:
    name: Create safety backup
    description: Create an internal ZIP backup before delete and replacement operations.
  prefer_hacs_uninstall:
    name: Prefer HACS uninstall
    description: Remove HACS-managed extensions through the HACS WebSocket API when possible.
  automatic_update_check:
    name: Check for updates automatically
    description: Check for a newer app version through the Home Assistant Supervisor at startup and periodically.
  update_check_interval_hours:
    name: App update check interval
    description: Number of hours between automatic version checks.
